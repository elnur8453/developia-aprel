<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let limit = +prompt("Limiti daxil edin: ");
        let hesab = 600; 

        if(limit > hesab){
            alert("Limit hesabdan boyukdur. Xeta bas verdi");
        }

        while(hesab > limit){
            hesab = hesab - 100;
            if(hesab === limit){
                alert("Limite catdiniz...");
            }
            console.log("Hesabda bu qeder qaldi: " + hesab);
        } // dogru oldugu muddetde yerine yetecek...
    </script>
</body>
</html>
