    <script>
        // daire sahesi tapan dustur

        function toplama(){

        daire_sahesi();

        function daire_sahesi(){
            let radius = +prompt("Dairenin radisusunu daxil edin");
            const pi = 3.14;
            let sahe = pi*radius**2;
            alert(sahe);
        }


        
        //a*b--> sahe dusturu 

        let a = +prompt("a terefini daxil edin:"); //7
        let b = +prompt("b terefini daxil edin:"); //5

        duzbucaqli_sahesi(a, b);

        function duzbucaqli_sahesi(a, b){
            let sahe = a * b; // 7*5 = 35-->sahe
            alert("duzbucaqlinin sahesi: " + sahe);
        }



    </script>
